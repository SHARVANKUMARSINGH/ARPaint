name: Build and Release ARPaint APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arpaint-2.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "ARPaint 2.0 APK (Build #${{ github.run_number }})"
          body: |
            ### ARPaint 2.0 Release 🚀
            
            - **Restored 3D Drawing**: Fixed GLSL fragment shader smoothstep bug that was discarding stroke fragments. 3D ribbon strokes now render with vibrant colors, Blinn-Phong specular shine, and real-time drop shadows.
            - **Real-Time AR Physics Mode**: Toggle "Phys ON / OFF" to let drawn 3D strokes fall under gravity, bounce off detected real-world floor planes, and come to a rest with realistic ground friction. "Float Back to Air" resets drawings.
            - **Modern Color & Thickness Pickers**: Smooth RGB sliders and quick preset swatches with live preview and explicit Done / Close buttons (no premature dismissal).
            - **Jetpack Compose & Material 3**: Sleek interface with bottom floating dock, AR status indicator, and intuitive controls.
            - **Video Recording**: Hardware-accelerated MP4 recording with direct save to `Movies/ARPaint/` and Gallery indexing.
            - **Stability & Performance**: Zero native memory leaks, thread-safe stroke management, and resilient ARCore lifecycle handling.
            
            **Download the pre-compiled `app-debug.apk` below to install.**
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
