name: Build ARPaint APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 20
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;20.0.5594570"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/20.0.5594570" >> $GITHUB_ENV
          echo "ndk.dir=$ANDROID_HOME/ndk/20.0.5594570" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARPaint-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
