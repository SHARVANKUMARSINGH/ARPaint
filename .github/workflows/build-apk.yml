name: Build and Release ARPaint APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arpaint-2.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "ARPaint 2.0 APK (Build #${{ github.run_number }})"
          body: |
            ### ARPaint 2.0 Release 🚀
            
            - **Jetpack Compose & Material 3**: Modern, sleek interface with bottom floating dock and AR status indicator.
            - **Video Recording**: Hardware-accelerated MP4 recording with direct save to `Movies/ARPaint/` and Gallery indexing.
            - **Modern Popups with Close Button**: Color picker with RGB sliders, stroke thickness with live canvas preview, video saved dialog, and clear confirmation.
            - **Stability & Crash Proof**: Fixed BadTokenException, native memory leaks, stroke concurrency issues, and ARCore lifecycle handling.
            - **New App Icon**: Custom AR 3D pencil emblem.
            
            **Download the pre-compiled `app-debug.apk` below to install.**
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
