name: Build ARPaint APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK Manager
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK 20
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;20.0.5594570"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/20.0.5594570" >> $GITHUB_ENV
          echo "ndk.dir=$ANDROID_HOME/ndk/20.0.5594570" >> local.properties

      - name: Patch legacy JCenter & Jacoco issues
        run: |
          # Remove dead jacoco-android plugin references
          sed -i '/jacoco-android/d' build.gradle app/build.gradle || true
          # Remove the jacoco { ... } configuration block in app/build.gradle
          sed -i '/jacoco\s*{/,/}/d' app/build.gradle || true
          # Inject mavenCentral() and JCenter mirror so legacy dependencies resolve
          sed -i 's/jcenter()/mavenCentral()\n        maven { url "https:\/\/://aliyun.com\/repository\/jcenter" }\n        jcenter()/g' build.gradle app/build.gradle || true

      - name: Switch to JDK 8 for Legacy Gradle Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARPaint-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
